[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lenia-criticality-lab"
version = "0.1.0"
description = "Scientific framework for continuous cellular automata (Lenia) analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.20",
  "scipy>=1.7",
  "matplotlib>=3.4",
  "scikit-learn>=1.0",
  "pandas",
  "pyarrow",
  "tqdm",
  "jax[cpu]",
  "equinox",
  "optax",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
